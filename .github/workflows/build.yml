name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: List project structure (debug)
        run: ls -la

      - name: Generate Android native project
        run: npx expo prebuild --platform android --verbose

      - name: List after prebuild (debug)
        run: ls -la

      - name: Check if android folder exists
        run: |
          if [ -d "android" ]; then
            echo "Android folder exists"
            ls -la android/
          else
            echo "Android folder does NOT exist"
            exit 1
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: albion-radar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
