name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android native project
        run: npx expo prebuild --platform android

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Find entry file
        id: entry
        run: |
          if [ -f "index.js" ]; then
            echo "entry=index.js" >> $GITHUB_OUTPUT
          else
            echo "entry=node_modules/expo/AppEntry.js" >> $GITHUB_OUTPUT
          fi

      - name: Bundle JavaScript for release
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file ${{ steps.entry.outputs.entry }} \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Verify bundle exists
        run: |
          ls -la android/app/src/main/assets/
          if [ ! -f "android/app/src/main/assets/index.android.bundle" ]; then
            echo "Bundle not created!"
            exit 1
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: albion-radar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
